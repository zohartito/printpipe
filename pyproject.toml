[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printpipe"
version = "0.1.0"
description = "Local-first reference-to-print pipeline for Bambu-ready 3MF bundles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Zohar Tito" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
mesh-repair = [
  "manifold3d>=2.3",
  "networkx>=3.0",
  "trimesh>=4.0",
]

[project.scripts]
printpipe = "printpipe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/printpipe"]
