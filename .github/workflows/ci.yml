name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # Pinned to v7 per tests/test_security_hardening.py.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python 3.12
      # Pinned to v7 per tests/test_security_hardening.py.
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.12"

    - name: Install locked dependencies and package
      # PRP-35: every dependency, including the build backend, comes from the hashed uv.lock.
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv==0.13.8
        uv export --locked --no-emit-project --extra dev --extra mesh-repair --group build -o "$RUNNER_TEMP/requirements.lock"
        python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements.lock"
        python -m pip install --no-deps --no-build-isolation -e .

    - name: Run test suite (pytest)
      env:
        # Bare runners have no Bambu Studio installation, so the profile
        # resolver reads the vendored Generic PLA chain instead. Workstations
        # keep using their real installed profiles. This is the LAST var in
        # PROFILE_ROOT_ENV_VARS on purpose: tests that monkeypatch
        # PRINTPIPE_BAMBU_PROFILE_ROOTS put their synthetic roots first, and
        # first root wins per profile name.
        PRINTPIPE_PROFILE_ROOTS: ${{ github.workspace }}/tests/fixtures/bambu/profiles/ci-root
      run: pytest -q

    - name: Lint with ruff (non-blocking)
      continue-on-error: true
      run: |
        pip install ruff
        ruff check .

  macos-native:
    name: Native macOS package verification
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.12"
    - name: Install locked dependencies and package
      run: |
        python -m pip install uv==0.13.8
        uv export --locked --no-emit-project --extra dev --extra mesh-repair --group build -o "$RUNNER_TEMP/requirements.lock"
        python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements.lock"
        python -m pip install --no-deps --no-build-isolation -e .
    - name: Verify native package tools
      run: |
        command -v codesign
        command -v hdiutil
        pytest -q tests/test_packaging_macos_app.py tests/test_packaging_macos_dmg.py tests/test_packaging_release.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action posts a PR summary on pull_request events, which needs
    # pull-requests: write. Without it the action throws a 403 ("Resource not
    # accessible by integration") and fails the job even when no leaks are found.
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      # Pinned to v7 per tests/test_security_hardening.py.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Run gitleaks
      # Pinned to v3.0.0 per tests/test_security_hardening.py.
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
