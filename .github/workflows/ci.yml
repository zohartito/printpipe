name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run test suite (pytest)
        run: pytest -q

      - name: Lint with ruff (non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action posts a PR summary on pull_request events, which needs
    # pull-requests: write. Without it the action throws a 403 ("Resource not
    # accessible by integration") and fails the job even when no leaks are found.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
